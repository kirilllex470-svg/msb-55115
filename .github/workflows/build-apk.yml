                              Intent openIntent = new Intent(MainActivity.this, MainActivity.class);
                              openIntent.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                              int piFlags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                              PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 1, openIntent, piFlags);
                              String tag = (idStr != null && !idStr.isEmpty())
                                  ? ("msb-alert-" + idStr)
                                  : ("msb-alert-" + (title + "_" + body).hashCode());
                              int notifId = tag.hashCode() & 0x7fffffff;
                              String replyTarget = (title != null && title.contains("•"))
                                  ? title.substring(title.lastIndexOf('•') + 1).trim()
                                  : title;
                              nm.notify(tag, notifId, MsbKeepAliveService.buildThemedAlertNotification(
                                  MainActivity.this, MsbKeepAliveService.ALERT_CH,
                                  title != null ? title : "МСБ-55115",
                                  body != null ? body : "",
                                  bgCol, accCol, avatarBmp, pi, false,
                                  replyTarget, tag, notifId
                              ));
                          } catch (Exception ignored) {}
                      }).start();
                  }
                  @JavascriptInterface
                  public void installApkUpdate(final String apkUrl) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !getPackageManager().canRequestPackageInstalls()) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Разрешите установку из этого источника и нажмите кнопку ещё раз", Toast.LENGTH_LONG).show());
                          try {
                              Intent perm = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName()));
                              perm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(perm);
                          } catch (Exception ignored) {}
                          return;
                      }
                      new Thread(() -> {
                          try {
                              File baseDir = getExternalCacheDir() != null ? getExternalCacheDir() : getCacheDir();
                              File outFile = new File(baseDir, "update_msb.apk");
                              if (outFile.exists()) outFile.delete();
                              HttpURLConnection conn = (HttpURLConnection) new URL(apkUrl).openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(20000);
                              conn.setReadTimeout(90000);
                              conn.connect();
                              if (conn.getResponseCode() != 200) {
                                  evalJs("if(window.onNativeApkProgress)window.onNativeApkProgress('❌ Ошибка сервера: " + conn.getResponseCode() + "', true);");
                                  return;
                              }
                              int totalLen = conn.getContentLength();
                              InputStream is = conn.getInputStream();
                              FileOutputStream fos = new FileOutputStream(outFile);
                              byte[] buf = new byte[8192];
                              int len;
                              long downloaded = 0;
                              int lastPct = -1;
                              while ((len = is.read(buf)) != -1) {
                                  fos.write(buf, 0, len);
                                  downloaded += len;
                                  if (totalLen > 0) {
                                      int pct = (int) ((downloaded * 100L) / totalLen);
                                      if (pct != lastPct && pct % 5 == 0) {
                                          lastPct = pct;
                                          evalJs("if(window.onNativeApkProgress)window.onNativeApkProgress('📥 Загрузка: " + pct + "%', false);");
                                      }
                                  }
                              }
                              fos.flush();
                              fos.close();
                              is.close();
                              java.io.RandomAccessFile raf = new java.io.RandomAccessFile(outFile, "r");
                              int b1 = raf.read();
                              int b2 = raf.read();
                              raf.close();
                              if (outFile.length() < 1000000 || b1 != 0x50 || b2 != 0x4B) {
                                  outFile.delete();
                                  evalJs("if(window.onNativeApkProgress)window.onNativeApkProgress('❌ На сервере нет целого APK-файла', true);");
                                  return;
                              }
                              evalJs("if(window.onNativeApkProgress)window.onNativeApkProgress('⚙️ Запуск установки...', true);");
                              final Uri apkUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".msbprovider", outFile);
                              runOnUiThread(() -> {
                                  try {
                                      Intent i = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                                      i.setData(apkUri);
                                      i.putExtra(Intent.EXTRA_NOT_UNKNOWN_SOURCE, true);
                                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(i);
                                  } catch (Exception e1) {
                                      try {
                                          Intent i2 = new Intent(Intent.ACTION_VIEW);
                                          i2.setDataAndType(apkUri, "application/vnd.android.package-archive");
                                          i2.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                          startActivity(i2);
                                      } catch (Exception e2) {
                                          Toast.makeText(MainActivity.this, "Ошибка запуска установщика: " + e2.getMessage(), Toast.LENGTH_LONG).show();
                                      }
                                  }
                              });
                          } catch (Exception e) {
                              evalJs("if(window.onNativeApkProgress)window.onNativeApkProgress('❌ Ошибка загрузки', true);");
                          }
                      }).start();
                  }
              }

              private void requestRequiredPermissions() {
                  List<String> need = new ArrayList<>();
                  int g = PackageManager.PERMISSION_GRANTED;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != g) {
                          need.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != g) need.add(Manifest.permission.RECORD_AUDIO);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != g) need.add(Manifest.permission.CAMERA);
                  if (!need.isEmpty()) {
                      String[] arr = new String[need.size()];
                      need.toArray(arr);
                      ActivityCompat.requestPermissions(this, arr, 101);
                  }
              }
          }
          EOF

      - name: Подпись единым ключом и компиляция APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/msb.keystore
          else
            keytool -genkey -v -keystore android/app/msb.keystore -alias msbkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass msb55115 -keypass msb55115 \
              -dname "CN=MSB55115, OU=Unit, O=MSB, L=RU, S=RU, C=RU"
          fi
          npx cap sync android
          VER_CODE=$(date +%s)
          sed -i "s/versionCode [0-9]*/versionCode $VER_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "app-release.apk" ! -name "app-aligned.apk" | head -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 "$RAW_APK" app/build/outputs/apk/release/app-aligned.apk
          "$APKSIGNER" sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks app/msb.keystore \
            --ks-key-alias msbkey \
            --ks-pass pass:msb55115 \
            --key-pass pass:msb55115 \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-aligned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Отправка нового APK на сервер и удаление старого
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
            VER_CODE=$(date +%s)
            curl -f -X POST "$SERVER_URL/api/app/upload-apk" \
              -H "x-update-secret: ${UPDATE_SECRET:-msb55115_ota_key}" \
              -H "x-version-code: $VER_CODE" \
              -H "x-version-name: 1.0.${{ github.run_number }}" \
              --data-binary "@$APK_PATH"
          fi

      - name: Выгрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MSB55115-FCM-APK
          path: android/app/build/outputs/apk/release/app-release.apk
