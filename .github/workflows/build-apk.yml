name: Сборка Android APK (МСБ-55115 + FCM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода проекта
        uses: actions/checkout@v4

      - name: Установка Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Синхронизация google-services.json и capacitor.config.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ОШИБКА: google-services.json не найден!"
            exit 1
          fi
          python3 -c '
          import json, os
          gs = json.load(open("google-services.json", encoding="utf-8"))
          first_client = next(iter(gs["client"]))
          pkg = first_client["client_info"]["android_client_info"]["package_name"]
          p = "capacitor.config.json"
          if os.path.exists(p):
              cfg = json.load(open(p, encoding="utf-8"))
          else:
              cfg = {"appName": "МСБ-55115", "webDir": "www"}
          cfg["appId"] = pkg
          cfg.setdefault("plugins", {})["PushNotifications"] = {
              "presentationOptions": ["badge", "sound", "alert"]
          }
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("Установлен appId:", pkg)
          '

      - name: Установка Capacitor 8 и Push Notifications
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<html><body></body></html>" > www/index.html
          fi
          npm install --save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/push-notifications@8
          npx cap add android

      - name: Подключение google-services.json в Gradle
        run: |
          cp google-services.json android/app/google-services.json
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i 's/dependencies {/dependencies {\n        classpath "com.google.gms:google-services:4.4.2"/' android/build.gradle
          fi
          if ! grep -q "firebase-messaging" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "dependencies {" >> android/app/build.gradle
            echo "    implementation \"com.google.firebase:firebase-messaging:24.1.0\"" >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: \"com.google.gms.google-services\"" >> android/app/build.gradle
          fi



      - name: Настройка AndroidManifest.xml
        run: |
          python3 -c '
          import json, os
          gs = json.load(open("google-services.json", encoding="utf-8"))
          pkg = next(iter(gs["client"]))["client_info"]["android_client_info"]["package_name"]

          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          names = [
              "INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_WIFI_STATE",
              "CHANGE_WIFI_STATE", "CAMERA", "RECORD_AUDIO",
              "MODIFY_AUDIO_SETTINGS", "POST_NOTIFICATIONS", "VIBRATE",
              "WAKE_LOCK", "RECEIVE_BOOT_COMPLETED", "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_DATA_SYNC",
              "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
              "REQUEST_INSTALL_PACKAGES"
          ]
          tag = "<uses-permission android:name=\"android.permission.{}\" />"
          perms = "\n    ".join([tag.format(n) for n in names])
          old_p = tag.format("INTERNET")
          if old_p in s:
              s = s.replace(old_p, perms, 1)
          else:
              s = s.replace("<application", perms + "\n    <application", 1)

          if "usesCleartextTraffic" not in s:
              ct = "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\""
              s = s.replace("<application", ct, 1)

          if "windowSoftInputMode" in s:
              s = s.replace("android:windowSoftInputMode=\"adjustPan\"", "android:windowSoftInputMode=\"adjustResize\"")
          else:
              s = s.replace("<activity", "<activity android:windowSoftInputMode=\"adjustResize\"", 1)

          svc = "\n".join([
              "        <meta-data",
              "            android:name=\"com.google.firebase.messaging.default_notification_channel_id\"",
              "            android:value=\"msb_alerts_high_v5\" />",
              "        <provider",
              "            android:name=\"androidx.core.content.FileProvider\"",
              "            android:authorities=\"" + pkg + ".msbprovider\"",
              "            android:exported=\"false\"",
              "            android:grantUriPermissions=\"true\">",
              "            <meta-data",
              "                android:name=\"android.support.FILE_PROVIDER_PATHS\"",
              "                android:resource=\"@xml/msb_file_paths\" />",
              "        </provider>",
              "        <service android:name=\".MsbKeepAliveService\"",
              "            android:enabled=\"true\" android:exported=\"false\"",
              "            android:stopWithTask=\"false\"",
              "            android:foregroundServiceType=\"dataSync\" />",
              "        <service android:name=\".MsbFcmService\"",
              "            android:exported=\"false\">",
              "            <intent-filter android:priority=\"999\">",
              "                <action android:name=\"com.google.firebase.MESSAGING_EVENT\" />",
              "            </intent-filter>",
              "        </service>",
              "        <receiver android:name=\".MsbRestartReceiver\"",
              "            android:enabled=\"true\" android:exported=\"true\">",
              "            <intent-filter>",
              "                <action android:name=\"android.intent.action.BOOT_COMPLETED\" />",
              "                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />",
              "            </intent-filter>",
              "        </receiver>",
              "    </application>"
          ])
          s = s.replace("</application>", svc, 1)
          open(p, "w", encoding="utf-8").write(s)

          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          fp_xml = "\n".join([
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              "<paths>",
              "    <cache-path name=\"apk_cache\" path=\".\" />",
              "    <external-cache-path name=\"ext_cache\" path=\".\" />",
              "</paths>"
          ])
          open("android/app/src/main/res/xml/msb_file_paths.xml", "w", encoding="utf-8").write(fp_xml)
          os.makedirs("android/app/src/main/res/layout", exist_ok=True)
          card_xml = "\n".join([
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              "<FrameLayout xmlns:android=\"http://" + "schemas." + "android.com" + "/apk/res/android\"",
              "    android:id=\"@+id/notif_root\"",
              "    android:layout_width=\"match_parent\"",
              "    android:layout_height=\"88dp\"",
              "    android:padding=\"0dp\">",

              "    <ImageView",
              "        android:id=\"@+id/notif_card_bg\"",
              "        android:layout_width=\"match_parent\"",
              "        android:layout_height=\"match_parent\"",
              "        android:scaleType=\"fitXY\" />",
              "    <LinearLayout",
              "        android:layout_width=\"match_parent\"",
              "        android:layout_height=\"match_parent\"",
              "        android:orientation=\"horizontal\"",
              "        android:gravity=\"center_vertical\"",
              "        android:paddingLeft=\"14dp\"",
              "        android:paddingRight=\"14dp\">",
              "        <ImageView",
              "            android:id=\"@+id/notif_bg_img\"",
              "            android:layout_width=\"46dp\"",
              "            android:layout_height=\"46dp\"",
              "            android:scaleType=\"centerCrop\"",
              "            android:layout_marginEnd=\"12dp\" />",
              "        <LinearLayout",
              "            android:layout_width=\"0dp\"",
              "            android:layout_height=\"wrap_content\"",
              "            android:layout_weight=\"1\"",
              "            android:orientation=\"vertical\">",
              "            <TextView",
              "                android:id=\"@+id/notif_title\"",
              "                android:layout_width=\"match_parent\"",
              "                android:layout_height=\"wrap_content\"",
              "                android:textStyle=\"bold\"",
              "                android:textSize=\"14sp\"",
              "                android:maxLines=\"1\"",
              "                android:ellipsize=\"end\" />",
              "            <TextView",
              "                android:id=\"@+id/notif_body\"",
              "                android:layout_width=\"match_parent\"",
              "                android:layout_height=\"wrap_content\"",
              "                android:layout_marginTop=\"3dp\"",
              "                android:textColor=\"#F8FAFC\"",
              "                android:textSize=\"13sp\"",
              "                android:maxLines=\"2\"",
              "                android:ellipsize=\"end\" />",
              "        </LinearLayout>",
              "    </LinearLayout>",
              "</FrameLayout>"
          ])
          open("android/app/src/main/res/layout/msb_notif_card.xml", "w", encoding="utf-8").write(card_xml)
          '

      - name: Создание ресивера и фоновой службы
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          JAVA_DIR=$(dirname "$MAIN_ACT")
          PKG_LINE=$(grep "^package " "$MAIN_ACT")

          echo "$PKG_LINE" > "$JAVA_DIR/MsbRestartReceiver.java"
          cat << 'EOF' >> "$JAVA_DIR/MsbRestartReceiver.java"

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class MsbRestartReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  try {
                      Intent s = new Intent(ctx, MsbKeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ctx.startForegroundService(s);
                      } else {
                          ctx.startService(s);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF
          echo "$PKG_LINE" > "$JAVA_DIR/MsbKeepAliveService.java"
          cat << 'EOF' >> "$JAVA_DIR/MsbKeepAliveService.java"

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;

          public class MsbKeepAliveService extends Service {
              public static final String ALERT_CH = "msb_alerts_high_v5";

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();
              }

              public static int resolveThemeBgColor(Context ctx) {
                  SharedPreferences sp = ctx.getSharedPreferences("msb_prefs", MODE_PRIVATE);
                  String t = sp.getString("theme_id", "military");
                  if ("rocket".equals(t)) return Color.parseColor("#2e140d");
                  if ("cosmic".equals(t)) return Color.parseColor("#1c1242");
                  return Color.parseColor("#102a1a");
              }

              public static int resolveThemeAccentColor(Context ctx) {
                  SharedPreferences sp = ctx.getSharedPreferences("msb_prefs", MODE_PRIVATE);
                  String t = sp.getString("theme_id", "military");
                  if ("rocket".equals(t)) return Color.parseColor("#f97316");
                  if ("cosmic".equals(t)) return Color.parseColor("#a855f7");
                  return Color.parseColor("#22c55e");
              }

              public static Notification buildThemedAlertNotification(
                  Context ctx, String channelId, String title, String body,
                  int bgCol, int accentCol, Bitmap avatarBmp, PendingIntent pi, boolean ongoing
              ) {
                  Bitmap badgeBmp = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(badgeBmp);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  RectF rf = new RectF(4f, 4f, 92f, 92f);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(Color.argb(140, 0, 0, 0));
                  c.drawOval(rf, p);
                  if (avatarBmp != null) {
                      Path clip = new Path();
                      clip.addOval(rf, Path.Direction.CW);
                      c.save();
                      c.clipPath(clip);
                      c.drawBitmap(avatarBmp, null, rf, p);
                      c.restore();
                  }
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(6f);
                  p.setColor(accentCol);
                  c.drawOval(rf, p);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setLargeIcon(badgeBmp)
                      .setColor(bgCol)
                      .setColorized(true)
                      .setPriority(ongoing ? NotificationCompat.PRIORITY_LOW : NotificationCompat.PRIORITY_HIGH)
                      .setOngoing(ongoing)
                      .setAutoCancel(!ongoing)
                      .setContentIntent(pi);

                  return b.build();

              }

              public static void ensureHighPriorityChannel(NotificationManager nm) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel bgCh = new NotificationChannel(
                          "msb_bg_service", "Фоновая связь МСБ-55115",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      nm.createNotificationChannel(bgCh);

                      Uri snd = RingtoneManager.getDefaultUri(
                          RingtoneManager.TYPE_NOTIFICATION
                      );
                      AudioAttributes attrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_EVENT)
                          .build();
                      NotificationChannel alCh = new NotificationChannel(
                          ALERT_CH, "Сообщения и тревоги МСБ-55115",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      alCh.enableVibration(true);
                      alCh.setVibrationPattern(new long[]{0, 700, 200, 700, 200, 900});
                      alCh.setSound(snd, attrs);
                      nm.createNotificationChannel(alCh);
                  }
              }

              private void createChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      ensureHighPriorityChannel(getSystemService(NotificationManager.class));
                  }
              }

              public static Notification buildBgNotification(Context ctx) {
                  Intent openIntent = new Intent(ctx, MainActivity.class);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  PendingIntent pi = PendingIntent.getActivity(ctx, 0, openIntent, piFlags);
                  return buildThemedAlertNotification(
                      ctx, "msb_bg_service",
                      "МСБ-55115 на связи",
                      "Защищенный канал оповещений активен",
                      resolveThemeBgColor(ctx),
                      resolveThemeAccentColor(ctx),
                      null, pi, true
                  );
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForeground(55115, buildBgNotification(this));
                  return START_STICKY;
              }

              @Override
              public void onDestroy() { super.onDestroy(); }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          echo "$PKG_LINE" > "$JAVA_DIR/MsbFcmService.java"
          cat << 'EOF' >> "$JAVA_DIR/MsbFcmService.java"

          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.os.Build;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Map;

          public class MsbFcmService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(RemoteMessage msg) {
                  Map<String, String> data = msg.getData();
                  String title = data.get("title");
                  String body = data.get("body");
                  if (title == null && msg.getNotification() != null) {
                      title = msg.getNotification().getTitle();
                  }
                  if (body == null && msg.getNotification() != null) {
                      body = msg.getNotification().getBody();
                  }
                  if (title == null) title = "МСБ-55115";
                  if (body == null) body = "Новое оповещение";

                  int bgCol = MsbKeepAliveService.resolveThemeBgColor(this);
                  int accCol = MsbKeepAliveService.resolveThemeAccentColor(this);
                  String bgHex = data.get("bgColor");
                  String accHex = data.get("accentColor");
                  if (bgHex != null && bgHex.startsWith("#")) {
                      try { bgCol = Color.parseColor(bgHex); } catch (Exception ignored) {}
                  }
                  if (accHex != null && accHex.startsWith("#")) {
                      try { accCol = Color.parseColor(accHex); } catch (Exception ignored) {}
                  }

                  Bitmap avatarBmp = null;
                  String imgUrl = data.get("image");
                  if (imgUrl != null && imgUrl.startsWith("http")) {
                      try {
                          HttpURLConnection conn = (HttpURLConnection) new URL(imgUrl).openConnection();
                          conn.setConnectTimeout(3000);
                          conn.setReadTimeout(3000);
                          conn.connect();
                          InputStream is = conn.getInputStream();
                          avatarBmp = BitmapFactory.decodeStream(is);
                          is.close();
                      } catch (Exception ignored) {}
                  }

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  MsbKeepAliveService.ensureHighPriorityChannel(nm);

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  PendingIntent pi = PendingIntent.getActivity(this, 2, openIntent, piFlags);

                  int notifId = (int) (System.currentTimeMillis() & 0x7fffffff);
                  nm.notify(notifId, MsbKeepAliveService.buildThemedAlertNotification(
                      this, MsbKeepAliveService.ALERT_CH,
                      title, body, bgCol, accCol, avatarBmp, pi, false
                  ));
              }
          }
          EOF

      - name: Настройка MainActivity
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          PKG_LINE=$(grep "^package " "$MAIN_ACT")
          echo "$PKG_LINE" > "$MAIN_ACT"
          cat << 'EOF' >> "$MAIN_ACT"

          import android.Manifest;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Array;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      MsbKeepAliveService.ensureHighPriorityChannel(nm);
                  }

                  requestRequiredPermissions();

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          String pkg = getPackageName();
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) {
                              String act = Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS;
                              Intent bi = new Intent(act);
                              bi.setData(Uri.parse("package:" + pkg));
                              startActivity(bi);
                          }
                      }
                  } catch (Exception ignored) {}

                  try {
                      Intent svc = new Intent(this, MsbKeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(svc);
                      } else {
                          startService(svc);
                      }
                  } catch (Exception ignored) {}

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView wv = getBridge().getWebView();
                      wv.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      WebSettings ws = wv.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setMediaPlaybackRequiresUserGesture(false);
                      wv.addJavascriptInterface(new MsbNativeBridge(), "MsbNative");
                  }
              }

              public class MsbNativeBridge {
                  @JavascriptInterface
                  public void setTheme(String themeId, String colorHex) {
                      try {
                          SharedPreferences sp = getSharedPreferences("msb_prefs", MODE_PRIVATE);
                          sp.edit().putString("theme_id", themeId != null ? themeId : "military").apply();
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          if (nm != null) {
                              nm.notify(55115, MsbKeepAliveService.buildBgNotification(MainActivity.this));
                          }
                      } catch (Exception ignored) {}
                  }
                  @JavascriptInterface
                  public void setIdentity(String unit, String callsign, String origin) {
                      try {
                          SharedPreferences sp = getSharedPreferences("msb_prefs", MODE_PRIVATE);
                          sp.edit()
                              .putString("unit", unit != null ? unit : "")
                              .putString("callsign", callsign != null ? callsign : "")
                              .putString("origin", origin != null ? origin : "")
                              .apply();
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void notify(String title, String body, String idStr, String colorHex) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          if (nm == null) return;
                          MsbKeepAliveService.ensureHighPriorityChannel(nm);

                          int bgCol = MsbKeepAliveService.resolveThemeBgColor(MainActivity.this);
                          int accCol = MsbKeepAliveService.resolveThemeAccentColor(MainActivity.this);
                          if (colorHex != null) {
                              int sep = colorHex.indexOf('|');
                              if (sep > 0) {
                                  String bgStr = colorHex.substring(0, sep);
                                  String accStr = colorHex.substring(sep + 1);
                                  try { bgCol = Color.parseColor(bgStr); } catch (Exception ignored) {}
                                  try { accCol = Color.parseColor(accStr); } catch (Exception ignored) {}
                              } else if (colorHex.startsWith("#")) {
                                  try { bgCol = Color.parseColor(colorHex); } catch (Exception ignored) {}
                              }
                          }

                          Intent openIntent = new Intent(MainActivity.this, MainActivity.class);
                          openIntent.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              piFlags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 1, openIntent, piFlags);

                          int notifId = (int) (System.currentTimeMillis() & 0x7fffffff);
                          nm.notify(notifId, MsbKeepAliveService.buildThemedAlertNotification(
                              MainActivity.this, MsbKeepAliveService.ALERT_CH,
                              title != null ? title : "МСБ-55115",
                              body != null ? body : "",
                              bgCol, accCol, null, pi, false
                          ));
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void installApkUpdate(final String apkUrl) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  File dir = getExternalCacheDir() != null ? getExternalCacheDir() : getCacheDir();
                                  File outFile = new File(dir, "update_msb.apk");
                                  if (outFile.exists()) outFile.delete();
                                  HttpURLConnection conn = (HttpURLConnection) new URL(apkUrl).openConnection();
                                  conn.setInstanceFollowRedirects(true);
                                  conn.setConnectTimeout(20000);
                                  conn.setReadTimeout(90000);
                                  conn.connect();
                                  if (conn.getResponseCode() != 200) return;

                                  InputStream is = conn.getInputStream();
                                  FileOutputStream fos = new FileOutputStream(outFile);
                                  byte[] buf = new byte[8192];
                                  int len;
                                  while ((len = is.read(buf)) != -1) {
                                      fos.write(buf, 0, len);
                                  }
                                  fos.flush();
                                  fos.close();
                                  is.close();

                                  if (outFile.length() < 500000) return;

                                  Uri apkUri = FileProvider.getUriForFile(
                                      MainActivity.this,
                                      getPackageName() + ".msbprovider",
                                      outFile
                                  );
                                  Intent intent = new Intent(Intent.ACTION_VIEW);
                                  intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                          }
                      }).start();
                  }

              }

              private void requestRequiredPermissions() {
                  List<String> need = new ArrayList<>();
                  int granted = PackageManager.PERMISSION_GRANTED;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      String pNotif = Manifest.permission.POST_NOTIFICATIONS;
                      if (ContextCompat.checkSelfPermission(this, pNotif) != granted) {
                          need.add(pNotif);
                      }
                  }
                  String pAudio = Manifest.permission.RECORD_AUDIO;
                  if (ContextCompat.checkSelfPermission(this, pAudio) != granted) {
                      need.add(pAudio);
                  }
                  String pCam = Manifest.permission.CAMERA;
                  if (ContextCompat.checkSelfPermission(this, pCam) != granted) {
                      need.add(pCam);
                  }
                  if (!need.isEmpty()) {
                      String[] arr = (String[]) Array.newInstance(String.class, need.size());
                      need.toArray(arr);
                      ActivityCompat.requestPermissions(this, arr, 101);
                  }
              }
          }
          EOF

      - name: Подпись единым ключом и компиляция APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/msb.keystore
          else
            keytool -genkey -v -keystore android/app/msb.keystore -alias msbkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass msb55115 -keypass msb55115 \
              -dname "CN=MSB55115, OU=Unit, O=MSB, L=RU, S=RU, C=RU"
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks app/msb.keystore \
            --ks-key-alias msbkey \
            --ks-pass pass:msb55115 \
            --key-pass pass:msb55115 \
            --out app/build/outputs/apk/release/app-release.apk \
            "$RAW_APK"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk


      - name: Отправка нового APK на сервер и удаление старого
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
            VER_CODE="${{ github.run_number }}"
            curl -f -X POST "$SERVER_URL/api/app/upload-apk" \
              -H "x-update-secret: ${UPDATE_SECRET:-msb55115_ota_key}" \
              -H "x-version-code: $VER_CODE" \
              -H "x-version-name: 1.0.$VER_CODE" \
              --data-binary "@$APK_PATH"
          fi

      - name: Выгрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MSB55115-FCM-APK
          path: android/app/build/outputs/apk/release/app-release.apk
