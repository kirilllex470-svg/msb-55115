name: Сборка Android APK (МСБ-55115)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода проекта
        uses: actions/checkout@v4

      - name: Установка Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Подготовка и установка Capacitor 8
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          mkdir -p www
          if [ ! -f www/index.html ]; then echo "<html><body style='background:#0f172a;'></body></html>" > www/index.html; fi
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android

      - name: Прописывание системных разрешений Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />"""
          s = s.replace("<uses-permission android:name=\"android.permission.INTERNET\" />", perms, 1)
          open(p, "w").write(s)
          '

      - name: Настройка фонового режима и авто-доступа к микрофону и камере
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          PKG_LINE=$(grep "^package " "$MAIN_ACT")
          cat << EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAllPermissions();
                  requestIgnoreBatteryOptimization();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }

              private void requestAllPermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.CAMERA);
                  perms.add(Manifest.permission.RECORD_AUDIO);
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add("android.permission.POST_NOTIFICATIONS");
                  }
                  List<String> toRequest = new ArrayList<>();
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          toRequest.add(p);
                      }
                  }
                  if (!toRequest.isEmpty()) {
                      ActivityCompat.requestPermissions(this, toRequest.toArray(new String[0]), 101);
                  }
              }

              private void requestIgnoreBatteryOptimization() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      }
                  }
              }
          }
          EOF

      - name: Финальная сборка APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выгрузка готового APK-файла
        uses: actions/upload-artifact@v4
        with:
          name: MSB-55115-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
