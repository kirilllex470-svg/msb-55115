                  private Runnable audioKeepTask = null;

                  private void applySpeakerRoute(android.media.AudioManager am, boolean on) {
                      if (am == null) return;
                      if (on) {
                          // Громкая связь: отпускаем голосовой захват и включаем полную громкость стереодинамиков (MODE_NORMAL)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              try { am.clearCommunicationDevice(); } catch (Exception ignored) {}
                          }
                          am.setMode(android.media.AudioManager.MODE_NORMAL);
                          am.setSpeakerphoneOn(true);
                          setVolumeControlStream(android.media.AudioManager.STREAM_MUSIC);
                      } else {
                          // Режим «Телефон» (только верхний динамик у уха): жестко переводим систему в голосовой вызов
                          am.requestAudioFocus(null, android.media.AudioManager.STREAM_VOICE_CALL, android.media.AudioManager.AUDIOFOCUS_GAIN_TRANSIENT);
                          am.setMode(android.media.AudioManager.MODE_IN_COMMUNICATION);
                          am.setSpeakerphoneOn(false);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              for (android.media.AudioDeviceInfo dev : am.getAvailableCommunicationDevices()) {
                                  if (dev.getType() == android.media.AudioDeviceInfo.TYPE_BUILTIN_EARPIECE) {
                                      am.setCommunicationDevice(dev);
                                      break;
                                  }
                              }
                          }
                          setVolumeControlStream(android.media.AudioManager.STREAM_VOICE_CALL);
                      }
                  }

                  @JavascriptInterface
