                                  }
                                  am.setSpeakerphoneOn(false);
                                  am.setMode(android.media.AudioManager.MODE_NORMAL);
                                  am.abandonAudioFocus(null);
                              }
                              setVolumeControlStream(android.media.AudioManager.USE_DEFAULT_STREAM_TYPE);
                          } catch (Exception ignored) {}
                      });
