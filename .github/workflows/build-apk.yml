name: Сборка Android APK (МСБ-55115 + FCM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода проекта
        uses: actions/checkout@v4

      - name: Установка Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Синхронизация google-services.json и capacitor.config.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ОШИБКА: google-services.json не найден!"
            exit 1
          fi
          python3 -c '
          import json, os
          gs = json.load(open("google-services.json", encoding="utf-8"))
          first_client = next(iter(gs["client"]))
          pkg = first_client["client_info"]["android_client_info"]["package_name"]
          p = "capacitor.config.json"
          if os.path.exists(p):
              cfg = json.load(open(p, encoding="utf-8"))
          else:
              cfg = {"appName": "МСБ-55115", "webDir": "www"}

          cfg["appId"] = pkg
          cfg["webDir"] = "www"
          cfg["server"] = {
              "androidScheme": "https",
              "hostname": "msb55115.local",
              "cleartext": True
          }

          cfg.setdefault("plugins", {})["PushNotifications"] = {
              "presentationOptions": ["badge", "sound", "alert"]
          }
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("Установлен appId:", pkg)
          '

      - name: Установка Capacitor 8 и Push Notifications
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          mkdir -p www
          cp -f index.html style.css journal.js messenger.js www/ 2>/dev/null || true
          for img in logo.jpg logo.jpeg logo.png; do
            if [ -f "$img" ]; then cp -f "$img" www/; fi
          done
          npm install --save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/push-notifications@8
          npx cap add android
      - name: Подключение google-services.json в Gradle
        run: |
          python3 -c '
          import glob, re
          for p in glob.glob("node_modules/@capacitor/android/**/CapacitorWebView.java", recursive=True):
              s = open(p, encoding="utf-8").read()
              m = re.search(r"(@Override\s+)?public\s+InputConnection\s+onCreateInputConnection\s*\([^)]*\)\s*\{", s)
              if m:
                  start = m.start()
                  brace_pos = s.find("{", m.end() - 1)
                  depth = 0
                  end = brace_pos
                  for i in range(brace_pos, len(s)):
                      if s[i] == "{":
                          depth += 1
                      elif s[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  s = s[:start] + s[end:]

              patch = """
              @Override
              public android.view.inputmethod.InputConnection onCreateInputConnection(android.view.inputmethod.EditorInfo outAttrs) {
                  android.view.inputmethod.InputConnection ic = super.onCreateInputConnection(outAttrs);
                  if (outAttrs != null) {
                      int cls = outAttrs.inputType & android.text.InputType.TYPE_MASK_CLASS;
                      int var = outAttrs.inputType & android.text.InputType.TYPE_MASK_VARIATION;
                      boolean isPass = (var == android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD)
                          || (var == android.text.InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD)
                          || (var == android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                      if (cls == android.text.InputType.TYPE_CLASS_TEXT && !isPass) {
                          outAttrs.inputType = android.text.InputType.TYPE_CLASS_TEXT
                              | android.text.InputType.TYPE_TEXT_VARIATION_SHORT_MESSAGE
                              | android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                              | android.text.InputType.TYPE_TEXT_FLAG_AUTO_CORRECT
                              | android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE;
                          outAttrs.imeOptions &= ~android.view.inputmethod.EditorInfo.IME_FLAG_NO_EXTRACT_UI;
                      }
                  }
                  return ic;
              }
          """
              idx = s.rfind("}")
              s = s[:idx] + patch + "\n}\n"
              open(p, "w", encoding="utf-8").write(s)
              print("Successfully replaced onCreateInputConnection in:", p)

          import os
          mirror = "maven { url \"https://googleapis.com\" }\n        "
          for fname in ["android/build.gradle", "android/settings.gradle"]:
              if os.path.exists(fname):
                  txt = open(fname, encoding="utf-8").read()
                  if "mavenCentral()" in txt and "://googleapis.com" not in txt:
                      txt = txt.replace("mavenCentral()", mirror + "mavenCentral()")
                      open(fname, "w", encoding="utf-8").write(txt)
                      print("Добавлено зеркало Maven в:", fname)
          '
          cp google-services.json android/app/google-services.json


          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i 's/dependencies {/dependencies {\n        classpath "com.google.gms:google-services:4.4.2"/' android/build.gradle
          fi
          if ! grep -q "firebase-messaging" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "dependencies {" >> android/app/build.gradle
            echo "    implementation \"com.google.firebase:firebase-messaging:24.1.0\"" >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: \"com.google.gms.google-services\"" >> android/app/build.gradle
          fi
      - name: Настройка AndroidManifest.xml
        run: |
          pip install pillow --quiet --break-system-packages || pip install pillow --quiet
          python3 -c '
          import json, os
          gs = json.load(open("google-services.json", encoding="utf-8"))
          pkg = next(iter(gs["client"]))["client_info"]["android_client_info"]["package_name"]

          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          names = [
              "INTERNET", "ACCESS_NETWORK_STATE",
              "CAMERA", "RECORD_AUDIO",
              "MODIFY_AUDIO_SETTINGS", "POST_NOTIFICATIONS", "VIBRATE",
              "WAKE_LOCK", "REQUEST_INSTALL_PACKAGES", "USE_FULL_SCREEN_INTENT"
          ]

          tag = "<uses-permission android:name=\"android.permission.{}\" />"
          perms = "\n    ".join([tag.format(n) for n in names])
          old_p = tag.format("INTERNET")
          if old_p in s:
              s = s.replace(old_p, perms, 1)
          else:
              s = s.replace("<application", perms + "\n    <application", 1)

          if "usesCleartextTraffic" not in s:
              ct = "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\""
              s = s.replace("<application", ct, 1)

          if "windowSoftInputMode" in s:
              s = s.replace("android:windowSoftInputMode=\"adjustPan\"", "android:showWhenLocked=\"true\" android:turnScreenOn=\"true\" android:windowSoftInputMode=\"adjustResize\"")
          else:
              s = s.replace("<activity", "<activity android:showWhenLocked=\"true\" android:turnScreenOn=\"true\" android:windowSoftInputMode=\"adjustResize\"", 1)

          svc = "\n".join([
              "        <meta-data",
              "            android:name=\"com.google.firebase.messaging.default_notification_channel_id\"",
              "            android:value=\"msb_alerts_high_v5\" />",
              "        <provider",
              "            android:name=\"androidx.core.content.FileProvider\"",
              "            android:authorities=\"" + pkg + ".msbprovider\"",
              "            android:exported=\"false\"",
              "            android:grantUriPermissions=\"true\">",
              "            <meta-data",
              "                android:name=\"android.support.FILE_PROVIDER_PATHS\"",
              "                android:resource=\"@xml/msb_file_paths\" />",
              "        </provider>",
              "        <service android:name=\".MsbFcmService\"",
              "            android:exported=\"false\">",
              "            <intent-filter android:priority=\"999\">",
              "                <action android:name=\"com.google.firebase.MESSAGING_EVENT\" />",
              "            </intent-filter>",
              "        </service>",
              "        <receiver android:name=\".MsbNotifReplyReceiver\"",
              "            android:enabled=\"true\" android:exported=\"false\" />",
              "        <receiver android:name=\".MsbCallDeclineReceiver\"",
              "            android:enabled=\"true\" android:exported=\"false\" />",
              "    </application>"
          ])
          queries_xml = "\n".join([
              "    <queries>",
              "        <intent>",
              "            <action android:name=\"android.intent.action.VIEW\" />",
              "            <data android:mimeType=\"application/vnd.android.package-archive\" />",
              "        </intent>",
              "        <intent>",
              "            <action android:name=\"android.intent.action.INSTALL_PACKAGE\" />",
              "        </intent>",
              "    </queries>",
              "</manifest>"
          ])
          s = s.replace("</application>", svc, 1).replace("</manifest>", queries_xml, 1)
          open(p, "w", encoding="utf-8").write(s)
          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          fp_xml = "\n".join([
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              "<paths>",
              "    <cache-path name=\"apk_cache\" path=\".\" />",
              "    <external-cache-path name=\"ext_cache\" path=\".\" />",
              "</paths>"
          ])
          open("android/app/src/main/res/xml/msb_file_paths.xml", "w", encoding="utf-8").write(fp_xml)
          from PIL import Image, ImageDraw, ImageOps
          import glob
          jpg_candidates = ["logo.jpg", "logo.jpeg", "logo.JPG", "logo.png"] + glob.glob("*.jpg") + glob.glob("*.jpeg")
          logo_path = next((f for f in jpg_candidates if os.path.exists(f)), None)

          def build_logo_png(size, silhouette_only):
              if logo_path:
                  img = Image.open(logo_path).convert("RGBA")
                  img = ImageOps.fit(img, (size, size), Image.Resampling.LANCZOS)
                  if silhouette_only:
                      gray = img.convert("L")
                      bg_val = gray.getpixel((0, 0))
                      out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
                      px_g = gray.load()
                      px_o = out.load()
                      for y in range(size):
                          for x in range(size):
                              if abs(px_g[x, y] - bg_val) > 32:
                                  px_o[x, y] = (255, 255, 255, 255)
                      return out
                  mask = Image.new("L", (size, size), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
                  out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
                  out.paste(img, (0, 0), mask)
                  return out
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(out)
              col = (255, 255, 255, 255) if silhouette_only else (34, 197, 94, 255)
              d.ellipse((4, 4, size - 5, size - 5), outline=col, width=max(2, size // 12))
              return out

          os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
          build_logo_png(96, True).save("android/app/src/main/res/drawable/ic_msb_logo.png", "PNG")
          build_logo_png(192, False).save("android/app/src/main/res/drawable/msb_brand_logo.png", "PNG")

          for d_name, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              d_dir = "android/app/src/main/res/" + d_name
              os.makedirs(d_dir, exist_ok=True)
              ic = build_logo_png(sz, False)
              ic.save(d_dir + "/ic_launcher.png", "PNG")
              ic.save(d_dir + "/ic_launcher_round.png", "PNG")

          for xml_f in ["android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"]:
              if os.path.exists(xml_f):
                  os.remove(xml_f)
          os.makedirs("android/app/src/main/res/layout", exist_ok=True)
          ns_uri = "/".join(["http:", "", "schemas." + "android." + "com", "apk", "res", "android"])
          notif_xml = "\n".join([
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              "<LinearLayout xmlns:android=\"" + ns_uri + "\"",
              "    android:id=\"@+id/msb_notif_root\"",
              "    android:layout_width=\"match_parent\"",
              "    android:layout_height=\"wrap_content\"",
              "    android:orientation=\"horizontal\"",
              "    android:gravity=\"center_vertical\"",
              "    android:paddingStart=\"0dp\"",
              "    android:paddingEnd=\"6dp\"",
              "    android:paddingTop=\"4dp\"",
              "    android:paddingBottom=\"4dp\"",
              "    android:background=\"@android:color/transparent\">",
              "    <ImageView",
              "        android:id=\"@+id/msb_notif_avatar\"",
              "        android:layout_width=\"36dp\"",
              "        android:layout_height=\"36dp\"",
              "        android:layout_marginStart=\"0dp\"",
              "        android:scaleType=\"centerCrop\" />",
              "    <LinearLayout",
              "        android:layout_width=\"0dp\"",
              "        android:layout_height=\"wrap_content\"",
              "        android:layout_weight=\"1\"",
              "        android:layout_marginStart=\"8dp\"",
              "        android:orientation=\"vertical\">",
              "        <TextView",
              "            android:id=\"@+id/msb_notif_title\"",
              "            android:layout_width=\"match_parent\"",
              "            android:layout_height=\"wrap_content\"",
              "            android:textColor=\"#166534\"",
              "            android:textStyle=\"bold\"",
              "            android:textSize=\"14sp\"",
              "            android:maxLines=\"1\" />",
              "        <TextView",
              "            android:id=\"@+id/msb_notif_body\"",
              "            android:layout_width=\"match_parent\"",
              "            android:layout_height=\"wrap_content\"",
              "            android:layout_marginTop=\"2dp\"",
              "            android:textColor=\"#111827\"",
              "            android:textStyle=\"normal\"",
              "            android:textSize=\"14sp\"",
              "            android:maxLines=\"3\" />",
              "    </LinearLayout>",
              "</LinearLayout>"
          ])
          open("android/app/src/main/res/layout/msb_notif_custom.xml", "w", encoding="utf-8").write(notif_xml)
          '

      - name: Создание ресивера и фоновой службы
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          JAVA_DIR=$(dirname "$MAIN_ACT")
          PKG_LINE=$(grep "^package " "$MAIN_ACT")

          echo "$PKG_LINE" > "$JAVA_DIR/MsbNotifReplyReceiver.java"
          cat << 'EOF' >> "$JAVA_DIR/MsbNotifReplyReceiver.java"

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import androidx.core.app.RemoteInput;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONObject;
          public class MsbNotifReplyReceiver extends BroadcastReceiver {
              public static final String KEY_TEXT_REPLY = "msb_key_text_reply";

              @Override
              public void onReceive(final Context ctx, Intent intent) {
                  Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);
                  if (remoteInput == null) return;
                  CharSequence replyCs = remoteInput.getCharSequence(KEY_TEXT_REPLY);
                  if (replyCs == null) return;
                  final String replyText = replyCs.toString().trim();
                  if (replyText.isEmpty()) return;

                  final String targetSender = intent.getStringExtra("reply_to");
                  final String notifTag = intent.getStringExtra("notif_tag");
                  final int notifId = intent.getIntExtra("notif_id", 0);

                  SharedPreferences sp = ctx.getSharedPreferences("msb_prefs", Context.MODE_PRIVATE);
                  final String origin = sp.getString("origin", "");
                  String callsign = sp.getString("callsign", "");
                  if (callsign.isEmpty()) callsign = sp.getString("user", "");
                  final String myName = callsign;

                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null && notifTag != null) {
                      nm.cancel(notifTag, notifId);
                  }

                  if (origin.isEmpty() || myName.isEmpty() || targetSender == null) return;
                  new Thread(() -> {
                      try {
                          URL url = new URL(origin + "/api/reply-from-notif");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setConnectTimeout(8000);
                          conn.setReadTimeout(8000);
                          conn.setDoOutput(true);
                          JSONObject json = new JSONObject();
                          json.put("sender", myName);
                          json.put("target", targetSender);
                          json.put("text", replyText);
                          OutputStream os = conn.getOutputStream();
                          os.write(json.toString().getBytes("UTF-8"));
                          os.flush();
                          os.close();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception ignored) {}
                  }).start();
              }
          }
          EOF

          echo "$PKG_LINE" > "$JAVA_DIR/MsbCallDeclineReceiver.java"
          cat << 'EOF' >> "$JAVA_DIR/MsbCallDeclineReceiver.java"

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONObject;

          public class MsbCallDeclineReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(final Context ctx, Intent intent) {
                  MsbFcmService.stopCallRingtone(ctx);
                  final String callerName = intent.getStringExtra("incoming_call_from");
                  SharedPreferences sp = ctx.getSharedPreferences("msb_prefs", Context.MODE_PRIVATE);
                  final String origin = sp.getString("origin", "https://amvera.tech");
                  String callsign = sp.getString("callsign", "");
                  if (callsign.isEmpty()) callsign = sp.getString("user", "");
                  final String myName = callsign;

                  if (callerName == null || callerName.isEmpty()) return;
                  new Thread(() -> {
                      try {
                          URL url = new URL(origin + "/api/call/end");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setConnectTimeout(6000);
                          conn.setReadTimeout(6000);
                          conn.setDoOutput(true);
                          JSONObject json = new JSONObject();
                          json.put("from", myName);
                          json.put("to", callerName);
                          json.put("reason", "declined");
                          OutputStream os = conn.getOutputStream();
                          os.write(json.toString().getBytes("UTF-8"));
                          os.flush();
                          os.close();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception ignored) {}
                  }).start();
              }
          }
          EOF
          echo "$PKG_LINE" > "$JAVA_DIR/MsbKeepAliveService.java"
          cat << 'EOF' >> "$JAVA_DIR/MsbKeepAliveService.java"

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.RemoteInput;

          public class MsbKeepAliveService {
              public static final String ALERT_CH = "msb_alerts_high_v5";

              public static int resolveThemeBgColor(Context ctx) {
                  SharedPreferences sp = ctx.getSharedPreferences("msb_prefs", Context.MODE_PRIVATE);
                  String t = sp.getString("theme_id", "military");
                  if ("rocket".equals(t)) return Color.parseColor("#2e140d");
                  if ("cosmic".equals(t)) return Color.parseColor("#1c1242");
                  if ("neon".equals(t))   return Color.parseColor("#2e0836");
                  if ("ocean".equals(t))  return Color.parseColor("#082f49");
                  if ("sunset".equals(t)) return Color.parseColor("#3b1506");
                  return Color.parseColor("#102a1a");
              }

              public static int resolveThemeAccentColor(Context ctx) {
                  SharedPreferences sp = ctx.getSharedPreferences("msb_prefs", Context.MODE_PRIVATE);
                  String t = sp.getString("theme_id", "military");
                  if ("rocket".equals(t)) return Color.parseColor("#f97316");
                  if ("cosmic".equals(t)) return Color.parseColor("#a855f7");
                  if ("neon".equals(t))   return Color.parseColor("#ec4899");
                  if ("ocean".equals(t))  return Color.parseColor("#06b6d4");
                  if ("sunset".equals(t)) return Color.parseColor("#f59e0b");
                  return Color.parseColor("#22c55e");
              }

               public static Bitmap prepareLargeCleanAvatar(Bitmap src) {
                  if (src == null) return null;
                  int targetSize = 96;
                  int minSide = Math.min(src.getWidth(), src.getHeight());
                  int x = (src.getWidth() - minSide) / 2;
                  int y = (src.getHeight() - minSide) / 2;
                  Bitmap square = Bitmap.createBitmap(src, x, y, minSide, minSide);
                  Bitmap scaled = Bitmap.createScaledBitmap(square, targetSize, targetSize, true);

                  Bitmap out = Bitmap.createBitmap(targetSize, targetSize, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(out);
                  Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Path clip = new Path();
                  clip.addCircle(targetSize / 2f, targetSize / 2f, targetSize / 2f, Path.Direction.CW);
                  canvas.clipPath(clip);
                  canvas.drawBitmap(scaled, 0, 0, paint);
                  return out;
              }
              public static Notification buildThemedAlertNotification(
                  Context ctx, String channelId, String title, String body,
                  int bgCol, int accentCol, Bitmap avatarBmp, PendingIntent pi, boolean ongoing,
                  String replyTarget, String notifTag, int notifId
              ) {
                  String pkg = ctx.getPackageName();
                  int smallIcon = ctx.getResources().getIdentifier("ic_msb_logo", "drawable", pkg);
                  if (smallIcon == 0) smallIcon = android.R.drawable.ic_dialog_info;

                  Bitmap bigCleanAvatar = prepareLargeCleanAvatar(avatarBmp);
                  int layoutId = ctx.getResources().getIdentifier("msb_notif_custom", "layout", pkg);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, channelId)
                      .setSmallIcon(smallIcon)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setColor(accentCol)
                      .setPriority(ongoing ? NotificationCompat.PRIORITY_LOW : NotificationCompat.PRIORITY_HIGH)
                      .setOngoing(ongoing)
                      .setAutoCancel(!ongoing)
                      .setContentIntent(pi);

                  if (!ongoing && layoutId != 0) {
                      int rootId = ctx.getResources().getIdentifier("msb_notif_root", "id", pkg);
                      int avId = ctx.getResources().getIdentifier("msb_notif_avatar", "id", pkg);
                      int titleId = ctx.getResources().getIdentifier("msb_notif_title", "id", pkg);
                      int bodyId = ctx.getResources().getIdentifier("msb_notif_body", "id", pkg);

                      RemoteViews rv = new RemoteViews(pkg, layoutId);
                      rv.setInt(rootId, "setBackgroundColor", Color.TRANSPARENT);
                      rv.setTextViewText(titleId, title);
                      if (accentCol != 0) rv.setTextColor(titleId, accentCol);
                      rv.setTextViewText(bodyId, body);
                      rv.setTextColor(bodyId, Color.parseColor("#111827"));

                      if (bigCleanAvatar != null) {
                          rv.setImageViewBitmap(avId, bigCleanAvatar);
                      } else {
                          int logoId = ctx.getResources().getIdentifier("msb_brand_logo", "drawable", pkg);
                          if (logoId == 0) logoId = ctx.getResources().getIdentifier("ic_launcher", "mipmap", pkg);
                          if (logoId != 0) rv.setImageViewResource(avId, logoId);
                      }

                      if (replyTarget != null && !replyTarget.isEmpty()) {
