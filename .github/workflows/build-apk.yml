                      runOnUiThread(() -> {
                          try {
                              final android.media.AudioManager am = (android.media.AudioManager) getSystemService(Context.AUDIO_SERVICE);
                              if (am == null) return;
                              if (audioKeepTask != null) {
                                  getWindow().getDecorView().removeCallbacks(audioKeepTask);
                                  audioKeepTask = null;
                              }
                              applySpeakerRoute(am, on);

                              // Если выбран режим «Телефон» (у уха) — повторяем привязку через 300 и 900 мс, чтобы Chromium не сбросил обратно в стерео
                              if (!on) {
                                  audioKeepTask = new Runnable() {
                                      int count = 0;
                                      @Override
                                      public void run() {
                                          try { applySpeakerRoute(am, false); } catch (Exception ignored) {}
                                          if (++count < 3) {
                                              getWindow().getDecorView().postDelayed(this, 500);
                                          }
                                      }
                                  };
                                  getWindow().getDecorView().postDelayed(audioKeepTask, 300);
                              }
                          } catch (Exception ignored) {}
                      });
                  }

