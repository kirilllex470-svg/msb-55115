    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
    }

    async function subscribeToWebPush() {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        try {
            if (Notification.permission === 'denied') return;
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') return;

            const reg = await navigator.serviceWorker.register('/sw.js');
            await reg.update();
            const readyReg = await navigator.serviceWorker.ready;

            if ('PushManager' in window && publicVapidKey) {
                let sub = await readyReg.pushManager.getSubscription();
                if (!sub) {
                    sub = await readyReg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                    });
                }
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'save_sub', user: currentUser || 'ГОСТЬ', sub: sub }));

    function createWavUrl(freq, durationSec, volume) {
        const sr = 8000;
        const numSamples = sr * durationSec;
        const buf = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buf);
        const writeStr = function(off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
        writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeStr(8, 'WAVE');
        writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
        view.setUint16(22, 1, true); view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data');
        view.setUint32(40, numSamples * 2, true);
        for (let i = 0; i < numSamples; i++) {
            let sample = 0;
            if (volume > 0) {
                const f = (i % sr < sr / 2) ? freq : freq * 1.3;
                sample = Math.sin(2 * Math.PI * f * (i / sr)) * volume * 32767;
            }
            view.setInt16(44 + i * 2, sample, true);
        }
        return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function connectWS() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        ws = new WebSocket(location.origin.replace(/^http/, 'ws'));

        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === 'init') {
                document.getElementById('table-body').innerHTML = '';
                msg.data.forEach(appendRow);
                allNotifications = msg.notifications || new Array();
                renderNotificationsWindow();

                if (msg.streamState) {
                    activeStream = msg.streamState;
                    updateStreamUI();
                }
                if (msg.vapidPublicKey) {
                    publicVapidKey = msg.vapidPublicKey;
                    subscribeToWebPush();
                }
                if (msg.alerts) {
                    pendingAlerts = msg.alerts;
                    checkAndShowAlerts(false);
                }
            }
            if (msg.type === 'new_row') appendRow(msg.row);
            if (msg.type === 'stream_state') {
                activeStream = msg.streamState || { active: false, url: '' };
                updateStreamUI();
            }
            if (msg.type === 'history_cleared') {
                document.getElementById('table-body').innerHTML = '';
                allNotifications = new Array();
                pendingAlerts = {};
                stopAlertVisuals();
                renderNotificationsWindow();
            }
            if (msg.type === 'admin_alert') {
                if (msg.notif) {
                    allNotifications.push(msg.notif);
                    renderNotificationsWindow();
                }
                const queue = getAlertsQueue(msg.target);
                queue.push({
                    id: msg.notif ? msg.notif.id : Date.now(),
                    text: msg.text,
                    sender: msg.sender || ADMIN_NAME
                });
                pendingAlerts[msg.target] = queue;
                checkAndShowAlerts(true);
            }
            if (msg.type === 'alert_cleared') {
                const queue = getAlertsQueue(msg.target);
                if (msg.notifId) {
                    pendingAlerts[msg.target] = queue.filter(function(a) { return a.id !== msg.notifId; });
                } else {
                    queue.shift();
                    pendingAlerts[msg.target] = queue;
                }
                if (pendingAlerts[msg.target] && pendingAlerts[msg.target].length === 0) {
                    delete pendingAlerts[msg.target];
                }

                if (msg.notifId) {
                    allNotifications.forEach(function(n) {
                        if (n.id === msg.notifId) {
                            n.read = true;
                            n.readBy = msg.readBy || '';
                        }
                    });
                } else {
                    let marked = false;
                    allNotifications.forEach(function(n) {
                        if (!marked && n.target === msg.target && !n.read) {
                            n.read = true;
                            n.readBy = msg.readBy || '';
                            marked = true;
                        }
                    });
                }
                renderNotificationsWindow();
                if (currentAlertTarget === msg.target && (!msg.notifId || currentAlertId === msg.notifId)) {
                    stopAlertVisuals();
                }
                checkAndShowAlerts(false);
            }
        };

        ws.onclose = function() { setTimeout(connectWS, 1500); };
    }

        if (currentUser) {
            const myQueue = getAlertsQueue(currentUser).filter(function(a) { return a.sender !== currentUser; });
            if (myQueue.length > 0) {

        if (!targetToShow) {
            const allQueue = getAlertsQueue("ВСЕМ").filter(function(a) { return !currentUser || a.sender !== currentUser; });
            if (allQueue.length > 0) {
                targetToShow = "ВСЕМ";
                alertObj = allQueue.at(0);

    function showAlert(target, text, sender, notifId, isNew) {
        currentAlertId = notifId || null;
        currentAlertTarget = target;
        currentAlertText = text;
        currentAlertSender = sender || ADMIN_NAME;

        const queueLen = getAlertsQueue(target).filter(function(a) { return !currentUser || a.sender !== currentUser; }).length;
        const countBadge = queueLen > 1 ? ' (1 из ' + queueLen + ')' : '';

        document.getElementById('alert-target-label').innerText = 'ДЛЯ [' + target + '] ОТ [' + currentAlertSender + ']' + countBadge + ':';
        document.getElementById('alert-text').innerText = text;
        document.getElementById('alert-modal').style.display = 'flex';

        updateLockScreenAlert(target, text, currentAlertSender);
        if (isNew || document.visibilityState === 'hidden') {
            sendLocalNotification(target, text, currentAlertSender);
        }

        if (!titleInterval) {
            let flag = false;
            titleInterval = setInterval(function() {
                document.title = flag ? "🛑 ТРЕВОГА! СООБЩЕНИЕ!" : "⚠️ ПРОЧИТАЙТЕ СООБЩЕНИЕ!";
                flag = !flag;
            }, 600);
        }
        playBeep();
        if (!soundInterval) {
            soundInterval = setInterval(playBeep, 2000);
        }
    }

    function stopAlertVisuals() {
        document.getElementById('alert-modal').style.display = 'none';
        currentAlertId = null;
        currentAlertTarget = "";
        if (titleInterval) { clearInterval(titleInterval); titleInterval = null; }
        if (soundInterval) { clearInterval(soundInterval); soundInterval = null; }
        if (sirenAudio) { sirenAudio.pause(); sirenAudio.currentTime = 0; }
        if (navigator.vibrate) navigator.vibrate(0);
        document.title = "МСБ55115";
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: '🟢 Дежурный режим активен',
                artist: 'Журнал Работ (Ожидание команд)'
            });
        }
    }

    function confirmAlert() {
        unlockMobileFeatures();
        const whoConfirmed = currentUser || 'Просмотр';
        const targetToClear = currentAlertTarget;
        const idToClear = currentAlertId;

        stopAlertVisuals();

        if (targetToClear) {
            const queue = getAlertsQueue(targetToClear);
            if (idToClear) {
                pendingAlerts[targetToClear] = queue.filter(function(a) { return a.id !== idToClear; });
            } else {
                queue.shift();
                pendingAlerts[targetToClear] = queue;
            }
            if (pendingAlerts[targetToClear] && pendingAlerts[targetToClear].length === 0) {
                delete pendingAlerts[targetToClear];
            }

            ws.send(JSON.stringify({
                type: 'clear_alert',
                target: targetToClear,
                notifId: idToClear,
                readBy: whoConfirmed
            }));
        }

        checkAndShowAlerts(false);
    }

    function submitRow() {
        if (!currentUser) return;
        let values = new Array();
        let isEmpty = true;
        for (let i = 0; i < COLUMNS_CONFIG.length; i++) {
            let val = document.getElementById('in-' + i).value;
            if (COLUMNS_CONFIG.at(i).digitsOnly && val) {
                val = val.replace(/[^0-9.,\/\\]/g, '');
            }
            values.push(val);
            if(val) isEmpty = false;
        }
        if (isEmpty) { alert("Пустая строка!"); return; }

        const now = new Date();
        ws.send(JSON.stringify({
            type: 'add_row',
            user: currentUser,
            color: userColor,
            time: now.toLocaleDateString() + ' ' + now.toLocaleTimeString().slice(0, 5),
            values: values
        }));

        for (let i = 0; i < COLUMNS_CONFIG.length; i++) document.getElementById('in-' + i).value = "";
    }

    function appendRow(row) {
        if (row.values && row.values.at(0)) {
            const firstCol = String(row.values.at(0));
            if (firstCol.indexOf("ОЗНАКОМЛЕН") !== -1 || firstCol.indexOf("УВЕДОМЛЕНИЕ") !== -1) {
                return;
            }
        }
        const tbody = document.getElementById('table-body');
        const tr = document.createElement('tr');
        tr.className = 'new-row';
        let html = '<td class="time-cell">' + row.time + '</td><td class="user-cell" style="color: ' + row.color + '">' + row.user + '</td>';
        
        for (let i = 0; i < COLUMNS_CONFIG.length; i++) {
            const val = (row.values && row.values.at(i) !== undefined) ? row.values.at(i) : '-';
            html += '<td>' + (val || '-') + '</td>';
        }
        
        tr.innerHTML = html;
        tbody.appendChild(tr);
        requestAnimationFrame(function() { tr.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    }
</script>
</body>
</html>
